name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  notify:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send deployment notification
        uses: Ilshidur/action-discord@master
        with:
          args: |
            🚀 **Grokxhat** deployet til produksjon via Vercel!

            Commit: ${{ github.sha }}
            Branch: main
            Author: ${{ github.actor }}
            Se: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
